<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vox Roddy — Panneau</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="content.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="sidepanel-app">
    <header class="sp-header">
      <span class="sp-title">Vox Roddy</span>
      <label class="sp-toggle" title="Quand cette option est active, les widgets ne s'affichent plus sur la page web (recharger la page pour appliquer)">
        <input type="checkbox" id="sp-mode-panel" checked>
        <span>Widgets dans le panneau</span>
      </label>
    </header>

    <nav class="sp-tabs" id="sp-tabs">
      <button class="sp-tab active" data-tab="practice">Studio</button>
      <button class="sp-tab" data-tab="piano">Piano</button>
      <button class="sp-tab" data-tab="playback">Lecture</button>
    </nav>

    <main class="sp-content">
      <section id="sp-tab-practice" class="sp-tab-panel active">
        <div class="widget-card" id="sp-card-metronome">
          <div class="widget-card-header">
            <span class="widget-card-title">⏱️ Métronome</span>
            <span class="widget-card-badge">Audio</span>
          </div>
          <div class="widget-card-body"></div>
        </div>
        <div class="widget-card" id="sp-card-tuner">
          <div class="widget-card-header">
            <span class="widget-card-title">🎸 Accordeur</span>
            <span class="widget-card-badge">Micro</span>
          </div>
          <div class="widget-card-body"></div>
        </div>
        <div class="widget-card" id="sp-card-chord">
          <div class="widget-card-header">
            <span class="widget-card-title">🎵 Détecteur d'Accords</span>
            <span class="widget-card-badge">Micro</span>
          </div>
          <div class="widget-card-body"></div>
        </div>
        <div class="widget-card" id="sp-card-singing">
          <div class="widget-card-header">
            <span class="widget-card-title">🎤 Vocal Pitch Tracker</span>
            <span class="widget-card-badge">Micro</span>
          </div>
          <div class="widget-card-body"></div>
        </div>
      </section>

      <section id="sp-tab-piano" class="sp-tab-panel">
        <div class="widget-card" id="sp-card-piano">
          <div class="widget-card-header">
            <span class="widget-card-title">🎹 Piano 88 touches</span>
            <span class="widget-card-badge">Audio</span>
          </div>
          <div class="widget-card-body"></div>
        </div>
      </section>

      <section id="sp-tab-playback" class="sp-tab-panel">
        <div class="widget-card">
          <div class="widget-card-header">
            <span class="widget-card-title">▶️ Vidéo (page active)</span>
          </div>
          <div class="widget-card-body sp-playback-body">
            <div class="sp-transport">
              <button class="sp-cmd" data-cmd="recule 10 secondes">−10 s</button>
              <button class="sp-cmd sp-cmd-primary" data-cmd="play">▶ Lecture</button>
              <button class="sp-cmd sp-cmd-primary" data-cmd="pause">⏸ Pause</button>
              <button class="sp-cmd" data-cmd="avance 10 secondes">+10 s</button>
            </div>
            <div class="sp-transport-row">
              <button class="sp-cmd" data-cmd="recule 30 secondes">−30 s</button>
              <button class="sp-cmd" data-cmd="recommence">⏮ Début</button>
              <button class="sp-cmd" data-cmd="avance 30 secondes">+30 s</button>
            </div>
          </div>
        </div>
        <div class="widget-card">
          <div class="widget-card-header">
            <span class="widget-card-title">📜 Défilement de la page</span>
          </div>
          <div class="widget-card-body sp-playback-body">
            <div class="sp-transport-row">
              <button class="sp-cmd sp-cmd-primary" data-cmd="défile">▶ Défiler</button>
              <button class="sp-cmd" data-cmd="arrête le scroll">⏸ Stop</button>
            </div>
            <div class="sp-transport-row">
              <button class="sp-cmd" data-cmd="moins vite">Moins vite</button>
              <button class="sp-cmd" data-cmd="plus vite">Plus vite</button>
              <button class="sp-cmd" data-cmd="tout en haut">⤒ Haut</button>
            </div>
          </div>
        </div>
        <div id="sp-cmd-status" class="sp-note" hidden></div>
      </section>

      <div id="sp-disabled-note" class="sp-note" hidden>
        Les widgets sont actuellement affichés sur la page web. Active
        « Widgets dans le panneau » ci-dessus, puis recharge la page.
      </div>
    </main>
  </div>

  <!-- Même montage que le dashboard : core + widgets originaux -->
  <script src="storageService.js"></script>
  <script src="core.js"></script>
  <script src="widgets/metronome.js"></script>
  <script src="widgets/tuner.js"></script>
  <script src="widgets/chordDetector.js"></script>
  <script src="widgets/singingTracker.js"></script>
  <script src="widgets/pianoKeyboard.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
