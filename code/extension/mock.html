<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Tablature Page - Vox Roddy</title>
  <link rel="stylesheet" href="content.css">
  
  <script>
    class MockSpeechRecognition {
      constructor() {
        this.continuous = false;
        this.interimResults = false;
        this.lang = 'fr-FR';
        this.onstart = null;
        this.onend = null;
        this.onresult = null;
        this.onerror = null;
        this._isListening = false;
        window.mockSpeechRecognition = this;
      }
      start() {
        if (this._isListening) return;
        this._isListening = true;
        console.log("[MockSpeechRecognition] start called");
        setTimeout(() => {
          if (this.onstart) this.onstart();
        }, 10);
      }
      stop() {
        if (!this._isListening) return;
        this._isListening = false;
        console.log("[MockSpeechRecognition] stop called");
        setTimeout(() => {
          if (this.onend) this.onend();
        }, 10);
      }
      simulateResult(text, isFinal = true) {
        if (!this._isListening) {
          console.warn("[MockSpeechRecognition] Cannot simulate result: Not listening");
          return;
        }
        const resultAlternative = {
          transcript: text,
          confidence: 0.99
        };
        const resultList = [resultAlternative];
        resultList.isFinal = isFinal;
        const event = {
          resultIndex: 0,
          results: [resultList]
        };
        if (this.onresult) {
          this.onresult(event);
        }
      }
    }
    try {
      delete window.SpeechRecognition;
      delete window.webkitSpeechRecognition;
      window.SpeechRecognition = MockSpeechRecognition;
      window.webkitSpeechRecognition = MockSpeechRecognition;
      console.log("[Mock] SpeechRecognition mocked successfully via delete.");
    } catch (e) {
      console.error("[Mock] Failed to define SpeechRecognition mock:", e);
    }
  </script>
