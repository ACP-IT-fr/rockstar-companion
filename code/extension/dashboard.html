<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Répertoire Vox Roddy</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar: Liste des Chansons -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-icon"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" x2="12" y1="19" y2="22"/></svg>Répertoire Vox Roddy</h1>
      </div>
      
      <!-- Recherche et Filtres -->
      <div class="filter-box">
        <input type="text" id="search-input" placeholder="Rechercher un titre, artiste...">
        
        <div class="filter-row">
          <select id="filter-key">
            <option value="">Toutes les clés</option>
          </select>
          
          <select id="filter-capo">
            <option value="">Tous capos</option>
            <option value="0">Sans capo</option>
            <option value="1">Capo 1</option>
            <option value="2">Capo 2</option>
            <option value="3">Capo 3</option>
            <option value="4">Capo 4</option>
            <option value="5">Capo 5</option>
            <option value="6">Capo 6</option>
            <option value="7">Capo 7</option>
            <option value="8">Capo 8+</option>
          </select>
        </div>
      </div>
      
      <!-- Liste des chansons -->
      <div class="song-list-container">
        <ul id="song-list">
          <!-- Rempli dynamiquement -->
        </ul>
      </div>
      
      <!-- Pied de page avec Import / Export & Spotify -->
      <div class="sidebar-footer">
        <div class="footer-buttons">
          <button id="export-btn" class="btn secondary-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            Exporter
          </button>
          <button id="import-btn" class="btn secondary-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
            Importer
          </button>
        </div>

        
        <input type="file" id="import-file-input" style="display: none;" accept=".json">
      </div>
    </aside>
    
    <!-- Zone Principale : Détail de la chanson -->
    <main class="main-content" id="no-song-selected">
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-secondary); opacity: 0.35;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <h2>Aucun morceau sélectionné</h2>
        <p>Sélectionnez un morceau dans la liste pour voir et modifier vos notes, astuces de jeu et playbacks.</p>
      </div>
    </main>

    <main class="main-content" id="song-detail-container" style="display: none;">
      <!-- En-tête du détail -->
      <header class="detail-header">
        <div class="header-titles">
          <input type="text" id="detail-title-input" class="detail-title-input" placeholder="Titre de la chanson">
          <input type="text" id="detail-artist-input" class="detail-artist-input" placeholder="Nom de l'artiste">
        </div>
        <div class="header-actions">
          <a id="detail-original-url" href="#" target="_blank" rel="noopener noreferrer" class="btn primary-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
            Ouvrir la tablature
          </a>
          <button id="detail-delete-btn" class="btn danger-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
            Supprimer
          </button>
        </div>
      </header>
      
      <!-- Métadonnées en badges & Saisie rapide -->
      <section class="metadata-section">
        <div class="meta-card">
          <label for="edit-key">Tonalité (Clé)</label>
          <input type="text" id="edit-key" placeholder="Ex: Gm / Sol min">
        </div>
        <div class="meta-card">
          <label for="edit-capo">Capodastre (Case)</label>
          <input type="number" id="edit-capo" min="0" max="24" value="0">
        </div>
        <div class="meta-card">
          <label for="edit-transpose">Transposition</label>
          <input type="number" id="edit-transpose" min="-12" max="12" value="0">
        </div>
      </section>
      
      <!-- Corps : Notes, Astuces et Playbacks -->
      <div class="detail-body-grid">
        <!-- Colonne Gauche : Notes & Astuces -->
        <div class="body-col">
          <div class="card">
            <h3 class="card-title-with-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card-title-icon"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              Notes d'interprétation
            </h3>
            <textarea id="edit-notes" placeholder="Notes de structure, intros, ressentis..."></textarea>
          </div>
          
          <div class="card mt-20">
            <h3 class="card-title-with-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card-title-icon"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A7 7 0 0 0 4 8c0 1 .3 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
              Astuces de jeu
            </h3>
            <textarea id="edit-tips" placeholder="Conseils de strumming, picking, rythmique..."></textarea>
          </div>
        </div>
        
        <!-- Colonne Droite : Liens & Lecteurs Playback -->
        <div class="body-col">
          <div class="card playlist-card">
            <div class="card-header-row">
              <h3 class="card-title-with-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card-title-icon"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                Liens de Playback / Backing Tracks
              </h3>
              <button id="add-link-btn" class="btn plus-btn">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
                Ajouter
              </button>
            </div>
            
            <!-- Liste des liens avec formulaire d'ajout rapide -->
            <div id="add-link-form" class="add-link-form" style="display: none;">
              <div class="form-group">
                <label for="new-link-title">Nom du lien :</label>
                <input type="text" id="new-link-title" placeholder="ex: Backing Track en Sol mineur">
              </div>
              <div class="form-group">
                <label for="new-link-url">URL (YouTube ou Spotify) :</label>
                <input type="text" id="new-link-url" placeholder="https://www.youtube.com/watch?...">
              </div>
              <div class="form-group">
                <label for="new-link-type">Type de lien :</label>
                <select id="new-link-type">
                  <option value="youtube">YouTube</option>
                  <option value="spotify">Spotify</option>
                  <option value="other">Autre</option>
                </select>
              </div>
              <div class="form-btn-row">
                <button id="save-link-btn" class="btn success-btn">Enregistrer</button>
                <button id="cancel-link-btn" class="btn secondary-btn">Annuler</button>
              </div>
            </div>

            <ul id="playback-links-list">
              <!-- Rempli dynamiquement -->
            </ul>
            
            <!-- Lecteurs embarqués -->
            <div id="media-embed-container" class="media-embed-container">
              <!-- Chargé dynamiquement -->
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Services et logique -->
  <script src="storageService.js"></script>
  <script src="exportService.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
