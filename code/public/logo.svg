<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" fill="#0B0B0F" rx="20" />
  
  <!-- Outer glowing ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.4" />
  
  <!-- Star path (Rockstar theme) -->
  <path d="M 50 15 L 61 38 L 86 38 L 66 53 L 73 78 L 50 63 L 27 78 L 34 53 L 14 38 L 39 38 Z" 
        fill="none" stroke="url(#neonGrad)" stroke-width="3" filter="url(#glow)" stroke-linejoin="round" />
        
  <!-- Guitar body overlay in the middle -->
  <path d="M 45 45 C 42 42 42 38 45 35 C 48 32 52 32 55 35 C 58 38 58 42 55 45 C 53 48 47 48 45 45 Z M 48 35 L 52 25 L 53 25 L 49 35 Z" 
        fill="url(#neonGrad)" opacity="0.9" />
</svg>
